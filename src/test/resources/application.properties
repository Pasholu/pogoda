spring.application.name=weather-app

# Тесты идут на встраиваемой базе в памяти; к источникам данных не обращаются.
spring.datasource.url=jdbc:h2:mem:audit;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
audit.ingest.enabled=false
audit.ingest.retry-pause-ms=0
