<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="ForecastAudit">
  <defs>
    <linearGradient id="aur" gradientUnits="userSpaceOnUse" x1="4" y1="10" x2="44" y2="38">
      <stop offset="0" stop-color="#35d6f5" />
      <stop offset="0.5" stop-color="#2f7bff" />
      <stop offset="1" stop-color="#9a5cff" />
    </linearGradient>
    <linearGradient id="sun" gradientUnits="userSpaceOnUse" x1="14" y1="6" x2="40" y2="34">
      <stop offset="0" stop-color="#ffe45c" />
      <stop offset="1" stop-color="#ff9a1f" />
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Кольцо прогнозов -->
  <circle cx="24" cy="24" r="17" fill="none" stroke="url(#aur)" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="0.1 7.63" />

  <!-- Факт: светящаяся точка в центре -->
  <circle cx="24" cy="24" r="10" fill="#ffb02e" opacity="0.7" filter="url(#glow)" />
  <circle cx="24" cy="24" r="7.5" fill="url(#sun)" />
</svg>
