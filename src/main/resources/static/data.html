<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#dcebfb" />
    <title>ForecastAudit — записи базы</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner topbar__inner--wide">
        <a class="brand" href="/" aria-label="ForecastAudit — на главную">
          <svg class="brand__mark" viewBox="0 0 48 48" aria-hidden="true">
            <defs>
              <linearGradient id="brand-ring" gradientUnits="userSpaceOnUse" x1="4" y1="10" x2="44" y2="38">
                <stop offset="0" stop-color="#35d6f5" />
                <stop offset="0.5" stop-color="#2f7bff" />
                <stop offset="1" stop-color="#9a5cff" />
              </linearGradient>
              <linearGradient id="brand-fact" gradientUnits="userSpaceOnUse" x1="14" y1="6" x2="40" y2="34">
                <stop offset="0" stop-color="#ffe45c" />
                <stop offset="1" stop-color="#ff9a1f" />
              </linearGradient>
              <filter id="brand-glow" x="-60%" y="-60%" width="220%" height="220%">
                <feGaussianBlur stdDeviation="3" />
              </filter>
            </defs>
            <circle class="brand__ring" cx="24" cy="24" r="17" />
            <circle class="brand__halo" cx="24" cy="24" r="10" />
            <circle class="brand__fact" cx="24" cy="24" r="7.5" />
          </svg>
          <span class="topbar__title">ForecastAudit</span>
        </a>
        <nav class="nav" aria-label="Разделы">
          <a class="nav__link" href="/">Метеопост хозяйства</a>
          <a class="nav__link" href="/audit.html">Аудит прогнозов</a>
        </nav>
      </div>
    </header>

    <main class="page page--wide">
      <h1 class="page__title">Записи базы</h1>
      <p class="page__lead page__lead--wide">
        Что сейчас лежит в хранилище: сводки станций, прогнозы моделей, справочник станций и журнал выгрузок.
        Только просмотр.
      </p>

      <div id="data" aria-live="polite"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.454.0/dist/umd/lucide.min.js"></script>
    <script src="/data.js"></script>
    <script src="/brand.js"></script>
  </body>
</html>
