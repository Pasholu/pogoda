spring.application.name=weather-app

# База данных. По умолчанию — PostgreSQL из docker-compose.yml этого проекта (порт 5434,
# чтобы не спорить с PostgreSQL, установленным в системе). На хостинге адрес, имя и пароль
# задаются переменными окружения DB_URL, DB_USER, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/forecastaudit?reWriteBatchedInserts=true}
spring.datasource.username=${DB_USER:forecast}
spring.datasource.password=${DB_PASSWORD:forecast}

# Выгрузка данных в базу: сводки каждые 3 часа, прогнозы каждый час (время UTC).
audit.ingest.enabled=true
audit.ingest.observations-cron=0 20 */3 * * *
audit.ingest.forecasts-cron=0 5 * * * *
